spring.application.name=civicos-api

# Local PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/civicos
spring.datasource.username=postgres
spring.datasource.password=ojaswi@2005

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}

# JWT
civicos.jwt.secret=${JWT_SECRET:CivicOS-Local-Development-Secret-Key-2026-Change-This}
civicos.jwt.expiration=${JWT_EXPIRATION:3600000}

# File uploads
spring.servlet.multipart.max-file-size=5MB
